<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FDE3E8">
  <title>For you</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d6336c' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">

  <!-- Fonts: Fraunces (headings), Covered By Your Grace (handwriting), Figtree (body).
       Without internet the page still works and falls back to system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="progress" aria-hidden="true"></div>
  <canvas id="fx-bg" aria-hidden="true"></canvas>

  <!-- Opening screen (built from config.gate) -->
  <div id="gate" role="dialog" aria-modal="true" aria-label="Welcome" hidden></div>

  <!-- Every section is rendered here from js/config.js -->
  <main id="app"></main>

  <canvas id="fx-top" aria-hidden="true"></canvas>

  <button id="music" class="music" type="button" aria-pressed="false" aria-label="Play music" hidden>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous">&lsaquo;</button>
    <div class="lb-stage"></div>
    <button class="lb-btn lb-next" type="button" aria-label="Next">&rsaquo;</button>
    <p class="lb-cap"></p>
    <p class="lb-count" aria-live="polite"></p>
  </div>

  <noscript><p style="padding:2rem;font-family:sans-serif">This page needs JavaScript turned on.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
